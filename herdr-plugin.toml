id = "shephrd"
name = "Shephrd"
version = "0.0.1"
min_herdr_version = "0.8.2"
platforms = ["linux"]

[[startup]]
command = ["./bin/shephrd", "serve", "--detach"]

[[actions]]
id = "serve"
title = "Start Shephrd"
contexts = ["global"]
command = ["./bin/shephrd", "serve", "--detach"]

[[actions]]
id = "view"
title = "View Shephrd threads"
contexts = ["global"]
command = ["./bin/shephrd", "view", "--open-pane"]

[[panes]]
id = "view"
title = "Shephrd threads"
placement = "split"
command = ["./bin/shephrd", "view"]
