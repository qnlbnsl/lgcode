id = "sheprd"
name = "Sheprd"
version = "0.0.1"
min_herdr_version = "0.8.2"
platforms = ["linux"]

[[startup]]
command = ["./bin/sheprd", "serve", "--detach"]

[[actions]]
id = "serve"
title = "Start Sheprd"
contexts = ["global"]
command = ["./bin/sheprd", "serve", "--detach"]

[[actions]]
id = "view"
title = "View Sheprd threads"
contexts = ["global"]
command = ["./bin/sheprd", "view", "--open-pane"]

[[panes]]
id = "view"
title = "Sheprd threads"
placement = "split"
command = ["./bin/sheprd", "view"]
