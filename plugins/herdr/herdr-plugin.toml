id = "lgcode"
name = "LGcode"
version = "0.0.1"
min_herdr_version = "0.8.2"
platforms = ["linux"]

[[startup]]
command = ["lgcode", "serve", "--detach"]

[[actions]]
id = "serve"
title = "Start LGcode"
contexts = ["global"]
command = ["lgcode", "serve", "--detach"]

[[actions]]
id = "view"
title = "View LGcode threads"
contexts = ["global"]
command = ["node", "./src/openPane.ts"]

[[panes]]
id = "view"
title = "LGcode threads"
placement = "split"
command = ["lgcode", "view"]
